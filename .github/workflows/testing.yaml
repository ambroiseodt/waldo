name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-vision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-vision-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-vision-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/data/vision/ --cov=waldo --cov-report term --durations=10

  test-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-language-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-language-

      - name: Install dependencies
        run: pip install -e ".[dev]" "mteb[xet]==2.10.4"

      - name: Run tests
        run: pytest tests/data/language/ --cov=waldo --cov-report term --durations=10

  test-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-models-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-models-

      - name: Install dependencies
        run: pip install -e ".[dev]" "transformers==5.2.0"

      - name: Run tests
        run: pytest tests/models/ --cov=waldo --cov-report term --durations=10
