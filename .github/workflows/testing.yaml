name: Testing

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run every test folder even if another one fails
      fail-fast: false
      matrix:
        folder:
          - tests/src/waldo/data
          - tests/src/waldo/eval
          - tests/src/waldo/infra
          - tests/src/waldo/models
          - tests/apps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyTorch (CPU)
        run: pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest ${{ matrix.folder }} --cov=waldo --cov-report term --durations=10
