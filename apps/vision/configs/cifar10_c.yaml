# Experiment
log_dir: "runs"
overwrite: false

# Model
model_name: "vit"
model_size: "base"
patch_size: 16

# Data
corruptions: ["contrast", "gaussian_noise", "motion_blur", "snow", "speckle_noise"]
severities: [1, 3, 5]
batch_size: 512

# Linear probing
tol: 1e-4
max_iter: 1000

# Device
device: "cuda:0"

# Reproducibility
seed: 42
